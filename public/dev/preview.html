<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모델 미리보기 (개발용)</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}#info{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;white-space:pre;background:#0008;padding:6px}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script>
</head><body><div id="info"></div>
<script type="module">
// 개발용: 변환한 GLB를 띄워 크기/방향을 확인. ?view=0..5 로 시점 변경
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#222');
scene.add(new THREE.HemisphereLight('#fff', '#555', 1.5)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(3, 5, 4); scene.add(d);
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 1000);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const t0 = performance.now();
loader.load(q.get('src') || '../models/room.glb', (g) => {
  const root = g.scene; scene.add(root);
  const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  let tris = 0, draws = 0; root.traverse((o) => { if (o.isMesh) { draws++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
  const r = size.length(); const v = Number(q.get('view') || 0);
  const dirs = [[0.6, 0.45, 1], [-1, 0.5, 0.2], [1, 0.5, -0.2], [0, 1, 0.01], [0, 0.3, -1], [0.2, 0.15, 1]];
  const dv = new THREE.Vector3(...dirs[v]).normalize();
  const k = Number(q.get('zoom') || 0.75);
  cam.position.copy(c).addScaledVector(dv, r * k); cam.near = r / 1000; cam.far = r * 10; cam.updateProjectionMatrix(); cam.lookAt(c);
  renderer.render(scene, cam);
  document.getElementById('info').textContent = `size ${size.x.toFixed(4)} x ${size.y.toFixed(4)} x ${size.z.toFixed(4)}\ncenter ${c.x.toFixed(4)},${c.y.toFixed(4)},${c.z.toFixed(4)}\nmin ${box.min.toArray().map(n=>n.toFixed(4))}\nmeshes ${draws} tris ${Math.round(tris)}\nload ${Math.round(performance.now()-t0)}ms`;
  window.__ready = true;
  (function loop() { renderer.render(scene, cam); requestAnimationFrame(loop); })();
}, undefined, (e) => { document.getElementById('info').textContent = 'ERROR ' + e.message; window.__ready = true; });
</script></body></html>
